<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punch's Parent Evaluator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --jungle: #1a4a2e;
    --leaf: #2d7a4f;
    --lime: #7ec850;
    --banana: #f5d020;
    --orange: #f5a623;
    --bark: #6b3a1f;
    --cream: #fef9ec;
    --soft: #fff8e7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--jungle);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 10% 20%, rgba(45,122,79,0.4) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(45,122,79,0.4) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(26,74,46,0.8) 0%, transparent 70%);
    pointer-events: none;
  }

  .leaves {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden;
  }
  .leaf {
    position: absolute;
    font-size: 3rem;
    opacity: 0.15;
    animation: sway 4s ease-in-out infinite;
  }
  .leaf:nth-child(1) { top: 5%; left: 2%; animation-delay: 0s; font-size: 4rem; }
  .leaf:nth-child(2) { top: 10%; right: 3%; animation-delay: 0.5s; font-size: 5rem; }
  .leaf:nth-child(3) { bottom: 10%; left: 5%; animation-delay: 1s; font-size: 3.5rem; }
  .leaf:nth-child(4) { bottom: 5%; right: 2%; animation-delay: 1.5s; font-size: 4.5rem; }
  .leaf:nth-child(5) { top: 50%; left: 0%; animation-delay: 2s; font-size: 3rem; }

  @keyframes sway {
    0%, 100% { transform: rotate(-5deg) scale(1); }
    50% { transform: rotate(5deg) scale(1.05); }
  }

  .container {
    position: relative;
    max-width: 680px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
    animation: dropIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes dropIn {
    from { transform: translateY(-40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .monkey-icon {
    font-size: 4rem;
    display: block;
    margin-bottom: 0.5rem;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 6vw, 3rem);
    color: var(--banana);
    line-height: 1.1;
    text-shadow: 3px 3px 0px var(--bark), 0 0 30px rgba(245,208,32,0.3);
  }

  .subtitle {
    color: var(--lime);
    font-size: 1rem;
    font-weight: 700;
    margin-top: 0.5rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .card {
    background: var(--cream);
    border-radius: 24px;
    padding: 2rem;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.8);
    animation: fadeUp 0.6s ease 0.2s both;
  }

  @keyframes fadeUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .camera-wrap {
    position: relative;
    background: #111;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 4/3;
    margin-bottom: 1.5rem;
    border: 3px solid var(--bark);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  #video, #canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #canvas { display: none; }

  .camera-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    color: #666;
    font-size: 1rem;
    font-weight: 700;
    gap: 0.5rem;
    background: #1a1a1a;
    transition: opacity 0.3s;
  }
  .camera-overlay.hidden { opacity: 0; pointer-events: none; }
  .camera-overlay span { font-size: 3rem; }

  .camera-wrap::before, .camera-wrap::after {
    content: '🌿';
    position: absolute;
    font-size: 1.5rem;
    z-index: 2;
  }
  .camera-wrap::before { top: 8px; left: 8px; }
  .camera-wrap::after { bottom: 8px; right: 8px; transform: rotate(180deg); }

  #preview {
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }

  .btn-row {
    display: flex; gap: 1rem; flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    min-width: 130px;
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, var(--banana), var(--orange));
    color: var(--bark);
    box-shadow: 0 4px 15px rgba(245,166,35,0.5);
  }
  .btn-secondary {
    background: var(--leaf);
    color: white;
    box-shadow: 0 4px 15px rgba(45,122,79,0.4);
  }
  .btn-shoot {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    color: white;
    box-shadow: 0 4px 15px rgba(231,76,60,0.5);
    font-size: 1.1rem;
  }
  .btn:disabled {
    opacity: 0.5; cursor: not-allowed; transform: none;
  }

  #result-section {
    display: none;
    margin-top: 1.5rem;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .result-card {
    background: linear-gradient(135deg, var(--jungle), #0f2d1a);
    border-radius: 20px;
    padding: 1.5rem;
    color: white;
    border: 2px solid var(--lime);
    box-shadow: 0 0 30px rgba(126,200,80,0.2);
  }

  .result-header {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 1.2rem;
  }

  .punch-avatar {
    font-size: 3.5rem;
    animation: wiggle 1s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .score-display { flex: 1; }

  .score-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--lime);
    font-weight: 700;
    margin-bottom: 0.3rem;
  }

  .score-number {
    font-family: 'Fredoka One', cursive;
    font-size: 3rem;
    line-height: 1;
    color: var(--banana);
    text-shadow: 0 0 20px rgba(245,208,32,0.5);
  }
  .score-number span {
    font-size: 1.2rem;
    color: var(--orange);
  }

  .score-bar-wrap {
    background: rgba(255,255,255,0.1);
    border-radius: 50px;
    height: 12px;
    overflow: hidden;
    margin: 0.8rem 0 1.2rem;
  }
  .score-bar {
    height: 100%;
    border-radius: 50px;
    background: linear-gradient(90deg, var(--lime), var(--banana));
    width: 0%;
    transition: width 1.5s cubic-bezier(0.34, 1.2, 0.64, 1);
    box-shadow: 0 0 10px rgba(126,200,80,0.6);
  }

  .verdict {
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    color: var(--banana);
    margin-bottom: 0.8rem;
  }

  .traits {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .trait {
    background: rgba(126,200,80,0.2);
    border: 1px solid rgba(126,200,80,0.4);
    border-radius: 50px;
    padding: 0.3rem 0.8rem;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--lime);
    display: flex; align-items: center; gap: 0.3rem;
  }

  .analysis-text {
    font-size: 0.95rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.85);
  }

  .punch-says {
    margin-top: 1.2rem;
    background: rgba(245,208,32,0.1);
    border-left: 3px solid var(--banana);
    padding: 0.8rem 1rem;
    border-radius: 0 12px 12px 0;
    font-style: italic;
    color: var(--banana);
    font-size: 0.9rem;
  }

  .loading {
    display: none;
    text-align: center;
    padding: 2rem;
    color: var(--leaf);
  }
  .loading.active { display: block; }
  .loading-monkey {
    font-size: 3rem;
    animation: spin 0.8s linear infinite;
    display: block;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .loading p {
    margin-top: 0.8rem;
    font-weight: 700;
    color: var(--bark);
  }

  .error-msg {
    color: #c0392b;
    font-size: 0.9rem;
    font-weight: 700;
    margin-top: 0.8rem;
    display: none;
    text-align: center;
    padding: 0.5rem;
    background: rgba(231,76,60,0.1);
    border-radius: 12px;
    border: 1px solid rgba(231,76,60,0.3);
  }
  .error-msg.visible { display: block; }

  footer {
    text-align: center;
    color: rgba(255,255,255,0.3);
    font-size: 0.75rem;
    margin-top: 2rem;
    padding-bottom: 1rem;
  }
</style>
</head>
<body>

<div class="leaves">
  <div class="leaf">🌿</div>
  <div class="leaf">🍃</div>
  <div class="leaf">🌱</div>
  <div class="leaf">🍃</div>
  <div class="leaf">🌿</div>
</div>

<div class="container">
  <header>
    <span class="monkey-icon">🐒</span>
    <h1>Punch's Parent Evaluator</h1>
    <p class="subtitle">Will you make a good monkey mama or papa?</p>
  </header>

  <div class="card">
    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <img id="preview" alt="Your photo">
      <div class="camera-overlay" id="camera-overlay">
        <span>📷</span>
        Start camera to begin
      </div>
    </div>

    <div class="btn-row" id="btn-row">
      <button class="btn btn-secondary" id="btn-start">📷 Start Camera</button>
      <button class="btn btn-shoot" id="btn-snap" disabled>🐒 Snap for Punch!</button>
      <button class="btn btn-primary" id="btn-retake" style="display:none">🔄 Retake</button>
    </div>

    <div class="error-msg" id="error-msg" role="alert"></div>

    <div class="loading" id="loading">
      <span class="loading-monkey">🐒</span>
      <p>Punch is evaluating you as a potential parent...</p>
    </div>

    <div id="result-section">
      <div class="result-card">
        <div class="result-header">
          <div class="punch-avatar">🐒</div>
          <div class="score-display">
            <div class="score-label">Punch's Parent Score</div>
            <div class="score-number" id="score-number">—<span>/100</span></div>
          </div>
        </div>
        <div class="score-bar-wrap">
          <div class="score-bar" id="score-bar"></div>
        </div>
        <div class="verdict" id="verdict"></div>
        <div class="traits" id="traits"></div>
        <div class="analysis-text" id="analysis-text"></div>
        <div class="punch-says" id="punch-says"></div>
      </div>
    </div>
  </div>

  <footer>Made with 🍌 for Punch</footer>
</div>

<script>
(function () {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const preview = document.getElementById('preview');
  const overlay = document.getElementById('camera-overlay');
  const btnStart = document.getElementById('btn-start');
  const btnSnap = document.getElementById('btn-snap');
  const btnRetake = document.getElementById('btn-retake');
  const loading = document.getElementById('loading');
  const resultSection = document.getElementById('result-section');
  const errorMsg = document.getElementById('error-msg');

  let stream = null;

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    if (video.srcObject) {
      video.srcObject = null;
    }
  }

  function setBusy(busy) {
    btnSnap.disabled = busy;
  }

  function showError(msg) {
    errorMsg.textContent = msg || '';
    errorMsg.classList.toggle('visible', !!msg);
  }

  function setUIState(state) {
    var hasCamera = state === 'camera';
    var hasPreview = state === 'preview' || state === 'loading';
    var showResult = state === 'result';
    var showLoading = state === 'loading';

    overlay.classList.toggle('hidden', hasCamera && !showLoading);
    if (video) video.style.display = hasCamera || hasPreview ? 'block' : 'none';
    if (preview) {
      preview.style.display = hasPreview && !showLoading ? 'block' : 'none';
    }
    if (btnStart) btnStart.style.display = state === 'idle' ? 'flex' : 'none';
    if (btnSnap) {
      btnSnap.style.display = (state === 'camera' || state === 'preview') ? 'flex' : 'none';
      btnSnap.disabled = state !== 'camera' || showLoading;
    }
    if (btnRetake) btnRetake.style.display = (state === 'preview' || state === 'result' || state === 'loading') ? 'flex' : 'none';
    if (loading) loading.classList.toggle('active', showLoading);
    if (resultSection) resultSection.style.display = showResult ? 'block' : 'none';
  }

  btnStart.addEventListener('click', function () {
    showError('');
    setUIState('camera');
    setBusy(true);
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(function (s) {
        stream = s;
        video.srcObject = stream;
        overlay.classList.add('hidden');
        btnStart.style.display = 'none';
        btnSnap.disabled = false;
        setBusy(false);
      })
      .catch(function (e) {
        setBusy(false);
        setUIState('idle');
        if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
          showError('Camera access denied. Please allow camera permissions and try again.');
        } else if (e.name === 'NotFoundError') {
          showError('No camera found. Please connect a camera and try again.');
        } else {
          showError('Could not start camera. Please try again.');
        }
        console.error('Camera error:', e);
      });
  });

  btnSnap.addEventListener('click', function () {
    if (!stream || !video.videoWidth) return;
    showError('');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    preview.src = dataUrl;
    stopCamera();
    preview.style.display = 'block';
    video.style.display = 'none';
    overlay.classList.add('hidden');
    btnStart.style.display = 'none';
    btnSnap.style.display = 'none';
    btnRetake.style.display = 'flex';
    btnRetake.disabled = false;
    resultSection.style.display = 'none';
    analyzeImage(dataUrl);
  });

  btnRetake.addEventListener('click', function () {
    showError('');
    stopCamera();
    preview.src = '';
    preview.style.display = 'none';
    video.style.display = 'block';
    video.srcObject = null;
    overlay.classList.remove('hidden');
    resultSection.style.display = 'none';
    loading.classList.remove('active');
    setUIState('idle');
  });

  function getApiUrl() {
    var base = window.location.origin;
    return base + '/api/evaluate';
  }

  function analyzeImage(dataUrl) {
    setUIState('loading');
    setBusy(true);

    fetch(getApiUrl(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl })
    })
      .then(function (response) {
        return response.json().then(function (data) {
          if (!response.ok) throw { status: response.status, data: data };
          return data;
        });
      })
      .then(function (result) {
        displayResult(result);
        setUIState('result');
        setBusy(false);
      })
      .catch(function (e) {
        setUIState('preview');
        setBusy(false);
        var status = e.status;
        var data = e.data || {};
        var detail = (data.details && String(data.details).trim()) ? ' ' + data.details : '';
        if (status === 503 && (data.code === 'NO_API_KEY' || (data.error && data.error.indexOf('key') !== -1))) {
          showError('Evaluation service is not configured yet. Please try again later.' + detail);
        } else if (status === 429) {
          showError('Too many requests — try again in a minute.' + detail);
        } else if (status === 401 || (detail && (detail.toLowerCase().indexOf('invalid') !== -1 || detail.toLowerCase().indexOf('unauthorized') !== -1))) {
          showError('Invalid API key. Check OPENROUTER_API_KEY in Vercel.' + detail);
        } else if (status >= 500 || e.message === 'Failed to fetch') {
          showError('Punch dropped the banana 🍌 — something went wrong. Please try again!' + detail);
        } else {
          showError((data.error || 'Something went wrong. Please try again!') + detail);
        }
        console.error('Analyze error:', e);
      });
  }

  function displayResult(result) {
    document.getElementById('score-number').innerHTML = result.score + '<span>/100</span>';
    document.getElementById('verdict').textContent = result.verdict;
    document.getElementById('analysis-text').textContent = result.analysis;
    document.getElementById('punch-says').textContent = '🐒 Punch says: "' + result.punch_quote + '"';

    var traitsEl = document.getElementById('traits');
    var traits = Array.isArray(result.traits) ? result.traits : [];
    traitsEl.innerHTML = traits.slice(0, 6).map(function (t) {
      var emoji = (t && t.emoji) ? t.emoji : '🐒';
      var label = (t && t.label) ? t.label : 'monkey vibe';
      return '<div class="trait">' + emoji + ' ' + label + '</div>';
    }).join('');

    var bar = document.getElementById('score-bar');
    bar.style.width = '0%';
    bar.offsetHeight;
    requestAnimationFrame(function () {
      bar.style.width = (result.score || 50) + '%';
    });
  }

  window.addEventListener('beforeunload', stopCamera);
  window.addEventListener('pagehide', stopCamera);
})();
</script>
</body>
</html>
